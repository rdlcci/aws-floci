version: '3.8'

services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/var/lib/floci
      - /var/run/docker.sock:/var/run/docker.sock   # needed for EC2/ECS container emulation
    environment:
      - DEBUG=1

volumes:
  floci-data: